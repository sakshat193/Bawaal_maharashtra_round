[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairdrop-common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "argon2-cffi>=23.1",
]

[tool.setuptools]
packages = ["fairdrop_common", "fairdrop_common._stubs"]
