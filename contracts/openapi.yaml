openapi: 3.1.0
info:
  title: Fair Drop API
  # Bump on every change under contracts/; needs approval from the other three.
  version: 0.2.0
  description: |
    Skeleton copied from the four-person build plan. Owners per route are in
    x-owner. Every private route authenticates with the platform identity JWT
    (Authorization: Bearer <jwt>); admin routes use the X-Admin-Key header.

    Errors always have the shape {"error": "<code>", "message": "<text>"}, with
    route-specific extra fields where noted (e.g. "refund" on payment_window_closed).
    Domain codes are the ErrorCode enum; generic codes (unauthorized,
    invalid_request, not_found, rate_limited, conflict) are TransportError.

    Timestamps are ISO-8601 UTC ending in Z. accepted_at keeps microseconds
    (always 6 digits); everything else is whole seconds.

servers:
  - url: http://localhost:8000

components:
  securitySchemes:
    identityJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA, iss=mock-platform, aud=fairdrop)
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key

  schemas:
    Phase:
      type: string
      enum: [scheduled, open, sealed, drawn, settled]
    OfferStatus:
      type: string
      enum: [offered, payment_pending, confirmed, expired, declined, payment_failed]
    EntryStatus:
      type: string
      enum: [registered, excluded, waitlisted, offered, payment_pending, confirmed,
             expired, declined, payment_failed, not_selected]
    ErrorCode:
      type: string
      enum: [window_closed, entry_exists_different_terms, unknown_tier,
             quantity_exceeds_max, turnstile_failed, offer_expired, offer_not_yours,
             already_redeemed_other_order, not_offered, payment_window_closed,
             not_payment_pending, payment_unavailable]
    TransportError:
      type: string
      enum: [unauthorized, invalid_request, not_found, rate_limited, conflict]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: "ErrorCode or TransportError" }
        message: { type: string }
        refund: { type: boolean, description: "Only on payment_window_closed" }

    SybilRule:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }
        kind: { type: string, enum: [max_per_device, max_per_payment, min_account_age_s] }
        limit: { type: integer, minimum: 1, description: "max_per_* rules" }
        value: { type: integer, minimum: 0, description: "min_account_age_s, seconds" }

    Tier:
      type: object
      required: [tier_id, name, price_paise, capacity]
      properties:
        tier_id: { type: string }
        name: { type: string }
        price_paise: { type: integer, minimum: 0 }
        capacity: { type: integer, minimum: 0 }

    DropSummary:
      type: object
      required: [drop_id, name, venue, starts_at, opens_at, closes_at, phase, allocation_mode]
      properties:
        drop_id: { type: string, format: uuid }
        name: { type: string }
        venue: { type: string }
        starts_at: { type: string, format: date-time }
        opens_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        phase: { $ref: "#/components/schemas/Phase" }
        allocation_mode: { type: string, enum: [lottery_wil, fcfs] }

    DropDetail:
      allOf:
        - $ref: "#/components/schemas/DropSummary"
        - type: object
          required: [tiers, config_hash, drand_chain, drand_round, drand_round_due_at,
                     server_time, counts]
          properties:
            tiers: { type: array, items: { $ref: "#/components/schemas/Tier" } }
            pow_required: { type: boolean }
            turnstile_required: { type: boolean }
            pow_bits: { type: integer }
            pow_k: { type: integer }
            pow_memory_kib: { type: integer }
            max_quantity: { type: integer }
            offer_ttl_s: { type: integer }
            pay_deadline_s: { type: integer }
            max_promotion_rounds: { type: integer }
            sybil_rules: { type: array, items: { $ref: "#/components/schemas/SybilRule" } }
            config_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
            drand_chain: { type: string }
            drand_round: { type: integer }
            drand_round_due_at: { type: string, format: date-time }
            server_time: { type: string, format: date-time }
            counts:
              type: object
              properties:
                entries: { type: integer }
                eligible: { type: [integer, "null"], description: "null until sealed" }
                excluded: { type: [integer, "null"], description: "null until sealed" }
            snapshot:
              type: [object, "null"]
              description: null until the snapshot exists
              properties:
                canonical_hash: { type: string }
                exclusions_hash: { type: string }
                sealed_at: { type: string, format: date-time }
                timestamped_at: { type: [string, "null"], format: date-time }

    CreateDropRequest:
      type: object
      required: [name, venue, starts_at, opens_at, closes_at, allocation_mode,
                 pow_required, turnstile_required, pow_bits, tiers]
      properties:
        drop_id: { type: string, format: uuid, description: "optional; generated if absent" }
        name: { type: string }
        venue: { type: string }
        starts_at: { type: string, format: date-time }
        opens_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        allocation_mode: { type: string, enum: [lottery_wil, fcfs] }
        pow_required: { type: boolean }
        turnstile_required: { type: boolean }
        pow_bits: { type: integer, minimum: 0, maximum: 24 }
        pow_k: { type: integer, default: 16 }
        pow_memory_kib: { type: integer, default: 2048 }
        max_quantity: { type: integer, default: 4, minimum: 1, maximum: 4 }
        offer_ttl_s: { type: integer, default: 600 }
        pay_deadline_s: { type: integer, default: 300 }
        max_promotion_rounds: { type: integer, default: 6 }
        sybil_rules: { type: array, items: { $ref: "#/components/schemas/SybilRule" } }
        tiers: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Tier" } }

    LoginRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        # Honoured ONLY when the server runs with DEMO_MODE on (harness risk knobs).
        device_hash: { type: string }
        payment_fingerprint: { type: string }
        account_age_days: { type: integer, minimum: 0 }
    LoginResponse:
      type: object
      required: [token, identity_id, expires_at]
      properties:
        token: { type: string }
        identity_id: { type: string }
        expires_at: { type: string, format: date-time }

    PowChallenge:
      type: object
      required: [challenge, issued_at, bits, k, memory_kib]
      properties:
        challenge: { type: string, pattern: "^[0-9a-f]{64}$" }
        issued_at: { type: string, format: date-time }
        bits: { type: integer }
        k: { type: integer }
        memory_kib: { type: integer }

    EntryRequest:
      type: object
      required: [tier_id, quantity]
      properties:
        tier_id: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 4 }
        turnstile_token: { type: string }
        pow:
          type: object
          required: [issued_at, nonces]
          properties:
            issued_at: { type: string, format: date-time }
            nonces: { type: array, items: { type: integer, minimum: 0 } }
    Receipt:
      type: object
      required: [drop_id, entry_id, tier_id, quantity, config_hash, accepted_at]
      properties:
        drop_id: { type: string, format: uuid }
        entry_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        tier_id: { type: string }
        quantity: { type: integer }
        config_hash: { type: string }
        accepted_at: { type: string, description: "microsecond precision, ends in Z" }
    EntryResponse:
      type: object
      required: [entry_id, receipt, receipt_sig]
      properties:
        entry_id: { type: string }
        receipt: { $ref: "#/components/schemas/Receipt" }
        receipt_sig: { type: string, description: "base64 Ed25519 over canonical receipt bytes" }

    Keys:
      type: object
      required: [receipt]
      properties:
        receipt:
          type: object
          properties:
            alg: { type: string, const: Ed25519 }
            public_key: { type: string, description: "base64 raw 32-byte key" }
            kid: { type: string }

    Me:
      type: object
      required: [phase, server_time, entry, offer]
      properties:
        phase: { $ref: "#/components/schemas/Phase" }
        server_time: { type: string, format: date-time }
        entry:
          type: [object, "null"]
          properties:
            entry_id: { type: string }
            tier_id: { type: string }
            quantity: { type: integer }
            status: { $ref: "#/components/schemas/EntryStatus" }
            rank: { type: [integer, "null"] }
            waitlist_position: { type: [integer, "null"] }
            exclusion_reason: { type: [string, "null"] }
        offer:
          type: [object, "null"]
          properties:
            offer_id: { type: string, format: uuid }
            tier_id: { type: string }
            quantity: { type: integer }
            amount_paise: { type: integer }
            round: { type: integer }
            status: { $ref: "#/components/schemas/OfferStatus" }
            expires_at: { type: string, format: date-time }
            pay_deadline: { type: [string, "null"], format: date-time }

    Draw:
      type: object
      required: [drop_id, round, signature, randomness, relays, drawn_at, ranked_entry_ids, allocation]
      properties:
        drop_id: { type: string, format: uuid }
        round: { type: integer, minimum: 1 }
        signature: { type: string }
        randomness: { type: string }
        relays: { type: array, items: { type: string } }
        drawn_at: { type: string, format: date-time }
        ranked_entry_ids: { type: array, items: { type: string } }
        allocation:
          type: array
          items:
            type: object
            required: [entry_id, tier_id, quantity, round, offer_id]
            properties:
              entry_id: { type: string }
              tier_id: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 4 }
              round: { type: integer, minimum: 0 }
              offer_id: { type: string, format: uuid }

    Invariants:
      type: object
      required: [tiers, oversell, held_mismatch, double_redemption]
      properties:
        tiers:
          type: array
          items:
            type: object
            required: [tier_id, held, active_offer_units, capacity]
            properties:
              tier_id: { type: string }
              held: { type: integer, minimum: 0 }
              active_offer_units: { type: integer, minimum: 0 }
              capacity: { type: integer, minimum: 0 }
        oversell: { type: integer, minimum: 0 }
        held_mismatch: { type: integer, minimum: 0 }
        double_redemption: { type: integer, minimum: 0 }

    Checkout:
      type: object
      required: [provider, key_id, provider_order_id, amount_paise, currency, pay_deadline]
      properties:
        provider: { type: string, const: razorpay }
        key_id: { type: string }
        provider_order_id: { type: string }
        amount_paise: { type: integer, minimum: 0 }
        currency: { type: string, const: INR }
        pay_deadline: { type: string, format: date-time }

    MockPayment:
      type: object
      required: [order_id, result]
      properties:
        order_id: { type: string }
        provider: { type: string, const: mock, default: mock }
        result: { type: string, enum: [success, fail] }

    RazorpayPayment:
      type: object
      required: [order_id, provider, razorpay_order_id, razorpay_payment_id, razorpay_signature]
      properties:
        order_id: { type: string }
        provider: { type: string, const: razorpay }
        razorpay_order_id: { type: string }
        razorpay_payment_id: { type: string }
        razorpay_signature: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /api/drops:
    get:
      x-owner: member-2
      x-edge-cache: 5s
      summary: Home list
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  drops: { type: array, items: { $ref: "#/components/schemas/DropSummary" } }

  /api/drops/{drop_id}:
    get:
      x-owner: member-2
      x-edge-cache: 2s
      summary: Tiers, phase, counts, config_hash, drand_round, server_time
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/DropDetail" } } }
        "404": { $ref: "#/components/responses/Error" }

  /platform/login:
    post:
      x-owner: member-2
      summary: Mock platform; username to identity JWT with risk facts
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } }
        "429": { $ref: "#/components/responses/Error" }

  /api/drops/{drop_id}/pow-challenge:
    get:
      x-owner: member-2
      security: [{ identityJwt: [] }]
      summary: Challenge bound to the caller's identity
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/PowChallenge" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: window_closed, $ref: "#/components/responses/Error" }

  /api/drops/{drop_id}/entries:
    post:
      x-owner: member-2
      security: [{ identityJwt: [] }]
      summary: Create entry, return signed receipt
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntryRequest" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/EntryResponse" } } }
        "200":
          description: Identical retry; same receipt
          content: { application/json: { schema: { $ref: "#/components/schemas/EntryResponse" } } }
        "400": { description: "turnstile_failed | unknown_tier | quantity_exceeds_max", $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: window_closed, $ref: "#/components/responses/Error" }
        "409": { description: entry_exists_different_terms, $ref: "#/components/responses/Error" }
        "422": { description: invalid_request (e.g. wrong number of nonces), $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/drops/{drop_id}/snapshot:
    get:
      x-owner: member-2
      x-edge-cache: immutable
      summary: Canonical snapshot bytes and the timestamp proof
      description: |
        Body is the stored canonical blob, byte for byte (newline-delimited JSON).
        Headers carry the evidence:
          X-Fairdrop-Snapshot-Sha256: hex
          X-Fairdrop-Exclusions-Sha256: hex
          X-Fairdrop-Sealed-At: ISO time
          X-Fairdrop-Timestamped-At: ISO time (absent until stamped)
          X-Fairdrop-Timestamp-Proof: base64 of the timestamp_proof JSON (absent until stamped)
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/x-ndjson: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/drops/{drop_id}/exclusions:
    get:
      x-owner: member-2
      x-edge-cache: immutable
      summary: Excluded entry_ids with the rule that fired (stored blob, byte for byte)
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/x-ndjson: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/keys:
    get:
      x-owner: member-2
      x-edge-cache: immutable
      summary: Public key for receipt signatures
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Keys" } } }

  /api/drops/{drop_id}/me:
    get:
      x-owner: member-3
      security: [{ identityJwt: [] }]
      summary: Caller's entry, status, rank, offer
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/drops/{drop_id}/draw:
    get:
      x-owner: member-3
      x-edge-cache: immutable
      summary: drand evidence, ranked entry_ids, initial allocation
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Draw" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/offers/{offer_id}/redeem:
    post:
      x-owner: member-3
      security: [{ identityJwt: [] }]
      summary: Lock the offer and open the payment window
      parameters: [{ name: offer_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties: { order_id: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer_id: { type: string }
                  order_id: { type: string }
                  status: { $ref: "#/components/schemas/OfferStatus" }
                  pay_deadline: { type: string, format: date-time }
        "403": { description: offer_not_yours, $ref: "#/components/responses/Error" }
        "409": { description: "offer_expired | already_redeemed_other_order | not_offered", $ref: "#/components/responses/Error" }

  /api/offers/{offer_id}/checkout:
    post:
      x-owner: member-3
      security: [{ identityJwt: [] }]
      summary: Create a Razorpay order for the caller's pending offer
      parameters: [{ name: offer_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Checkout" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: not_payment_pending, $ref: "#/components/responses/Error" }
        "503": { description: payment_unavailable, $ref: "#/components/responses/Error" }

  /api/offers/{offer_id}/pay:
    post:
      x-owner: member-3
      security: [{ identityJwt: [] }]
      summary: Submit mock result or verified Razorpay payment identifiers
      parameters: [{ name: offer_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/MockPayment" }
                - { $ref: "#/components/schemas/RazorpayPayment" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, enum: [confirmed, payment_failed] } }
        "409": { description: "payment_window_closed (refund: true) | not_payment_pending | payment_unavailable", $ref: "#/components/responses/Error" }

  /api/offers/{offer_id}/decline:
    post:
      x-owner: member-3
      security: [{ identityJwt: [] }]
      summary: Release an offer
      parameters: [{ name: offer_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/drops/{drop_id}/invariants:
    get:
      x-owner: member-3
      x-edge-cache: 2s
      summary: held against capacity, duplicate counters
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Invariants" } } } }

  /api/admin/drops:
    post:
      x-owner: member-2
      security: [{ adminKey: [] }]
      summary: Create drop, compute drand_round and config_hash
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateDropRequest" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/DropDetail" } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/admin/drops/{drop_id}/open:
    post:
      x-owner: member-2
      security: [{ adminKey: [] }]
      summary: Open now (demo)
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/drops/{drop_id}/seal:
    post:
      x-owner: member-2
      security: [{ adminKey: [] }]
      summary: Seal now (demo). Idempotent; resumes an interrupted seal or retries the timestamp.
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/drops/{drop_id}/draw:
    post:
      x-owner: member-3
      security: [{ adminKey: [] }]
      summary: Draw once round R is available
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }

  /api/admin/drops/{drop_id}/outcomes:
    get:
      x-owner: member-3
      security: [{ adminKey: [] }]
      summary: entry_id, identity_id, quantity, status, for harness scoring
      parameters: [{ name: drop_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }

  /api/admin/reset:
    post:
      x-owner: member-2
      security: [{ adminKey: [] }]
      summary: Wipe and reseed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seed_demo_drop: { type: boolean, default: true }
      responses:
        "200": { description: OK }
