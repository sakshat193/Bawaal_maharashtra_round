<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" role="img" aria-labelledby="title description">
<title id="title">Offline Fair Drop attack simulation</title><desc id="description">Average broker ticket share over 250 seeded trials. Groups enter individually alongside singles.</desc>
